name: Deploy to GitHub Pages

# Publishes the site by syncing main to the gh-pages branch. GitHub serves
# Pages from that branch — a setup the default workflow token can manage,
# unlike the artifact-based flow which needs admin rights to create the
# Pages site.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
